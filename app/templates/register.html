<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShueBank Register</title>
</head>

<body>
    <h1>🏦 ShueBank</h1>

    <h2>Create Account</h2>

    <form method="POST" action="/register">
        <label>Full Name:</label><br>
        <input type="text" name="full_name" placeholder="Enter your full name" required><br><br>

        <label>Username:</label><br>
        <input type="text" name="username" placeholder="Create username" required><br><br>

        <label>Password:</label><br>
        <input type="password" name="password" placeholder="Create password" required><br><br>

        <label>Confirm Password:</label><br>
        <input type="password" name="confirm_password" placeholder="Confirm password" required><br><br>

        <button type="submit">Register</button>
    </form>

    <p>
        Already have an account?
        <a href="/templates/login.html">Login</a>
    </p>
</body>
</html>
